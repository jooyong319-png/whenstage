# 매시간 알림 크론 호출 (2026-10-13)
#
# 알림 발송(app/api/cron/notify)은 이 주소가 호출될 때 돈다. Vercel 무료 크론은 하루 1회뿐이라 매시간 호출이
# 따로 필요하다('예매 1시간 전' 알림, 사용자가 고른 시각 발송 — Vercel의 CRON_HOURLY=1).
# 예전부터 cron-job.org가 매시 정각에 부르고 있었다. 처음엔 "하루 1번만 호출된다"고 잘못 판단해 이걸 만들었는데,
# 그건 Vercel 무료 플랜이 접속 기록을 **약 1시간만** 보관해서 그렇게 보인 것이었다(11:00·12:00 정각 호출 확인).
# → 이쪽(GitHub Actions)만 남기기로 했다(2026-10-13 사장님 결정). cron-job.org 잡은 끈다.
# 겹쳐 돌아도 같은 알림이 두 번 가지는 않는다(push_sent_log로 막힌다).
# 이쪽의 장점: 실행 기록이 Actions 탭에 남아 꺼지면 보인다.
# 비밀값 CRON_SECRET(저장소 Settings → Secrets → Actions) = Vercel의 CRON_SECRET.
name: Notify hourly

on:
  schedule:
    # 매시 7분 — 정각은 GitHub 예약 실행이 몰려 크게 밀린다. '1시간 전' 창(오픈 15~75분 전)에 들어간다
    - cron: '7 * * * *'
  workflow_dispatch: {}   # 수동 실행(시험용)

permissions: {}

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 알림 크론 호출
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::저장소 비밀값 CRON_SECRET이 없다 — Settings → Secrets and variables → Actions에 등록할 것"
            exit 1
          fi
          # 응답(발송 수 등)을 로그에 남긴다 — 실패하면 워크플로가 빨갛게 보인다
          code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" https://whenstage.com/api/cron/notify)
          cat resp.json; echo
          echo "HTTP $code"
          [ "$code" = "200" ]
